server {
    listen 80;
    server_name localhost;

    # Root directory serving compiled Vite static assets
    root /usr/share/nginx/html;
    index index.html;

    # SPA Static Host Rewrites: Mandatory for client-side React Router navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets caching strategy: Cache aggressively (1 year, immutable)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?|eot|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry Point (index.html): Must NOT be cached to ensure instant deployment updates
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
