services:
  postgres:
    image: postgres:16-alpine
    container_name: bbl-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmark_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmark_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bbl-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bookmark_db?schema=public"
      PORT: 3001
      AUTH0_ISSUER_URL: "https://dev-yg.us.auth0.com/"
      AUTH0_AUDIENCE: "https://bbl-candidate-test-api"
      AUTH0_CLIENT_ID: "H9F6QG5SzTKMv0tbmgxLj9LjG1EKVllA"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:3001"
        VITE_AUTH0_DOMAIN: "dev-yg.us.auth0.com"
        VITE_AUTH0_CLIENT_ID: "H9F6QG5SzTKMv0tbmgxLj9LjG1EKVllA"
        VITE_AUTH0_AUDIENCE: "https://bbl-candidate-test-api"
    container_name: bbl-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
